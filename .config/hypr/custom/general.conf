# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/decoration:blur:enabled = 0
# MONITOR CONFIG
#monitor=DP-2,2560x1440@143.97,0x0,1
#monitor=HDMI-A-2,2560x1440@143.97,0x0,1
# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area
monitor=DP-2,2560x1440@165.00,0x0,1
# HDMI port: mirror display. To see device name, use `hyprctl monitors`
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1

input {
    kb_layout = es
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = 0
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty)
    allow_session_lock_restore = true
    session_lock_xray = true
    initial_workspace_tracking = false
    focus_on_activate = false
    render_unfocused_fps=45
}
general {
    gaps_out = 6
    border_size =0
}
decoration:blur:enabled = 0
