    #float
windowrule = match:class moe.launcher.*, tag +float
windowrule = match:class ^(pavucontrol)$ , tag +float
windowrule = match:class ^(org.pulseaudio.pavucontrol)$ , tag +float
windowrule = match:class ^(nm-connection-editor)$ , tag +float
windowrule = match:class steam, tag +float
windowrule = match:class steam, match:title Steam, tag -float
windowrule = match:class steam, match:title ^$, tag -float
windowrule = match:class org.qbittorrent.qBittorrent , tag +float

