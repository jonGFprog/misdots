windowrule = match:class steam_app_1671210, tag +nofullscreengame
windowrule = match:title UNDERTALE, tag +nofullscreengame
windowrule = match:title ものべの, tag +nofullscreengame

#windowrulev2=tag +nofullscreengame,class: steam_app_1671210,title: THE DARK
#windowrulev2=tag +nofullscreengame,class: steam_app_1671210
