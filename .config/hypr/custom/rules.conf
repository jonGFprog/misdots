    #opacity
#windowrulev2 = tag +opacity, class: discord

windowrule = match:class ^(org.kde.kate)$, tag +opacity
windowrule = match:class ^(org.gnome.Nautilus)$, tag +opacity
windowrule = match:class ^(org.kde.dolphin)$, tag +opacity
windowrule = match:class ^(net.lutris.Lutris)$, tag +opacity
windowrule = match:class steam, match:title Steam, tag +opacity

# windowrulev2 = tag +opacity, class: ^(org.kde.kate)$
# windowrulev2 = tag +opacity, class: ^(org.gnome.Nautilus)$
# windowrulev2 = tag +opacity, class: ^(org.kde.dolphin)$
# windowrulev2 = tag +opacity, class: ^(net.lutris.Lutris)$
